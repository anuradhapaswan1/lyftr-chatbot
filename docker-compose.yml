services:
  backend:
    build: ./backend
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-2.5-flash}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      CACHE_TYPE: ${CACHE_TYPE:-disk}
      CACHE_DIR: ${CACHE_DIR:-/data/llm_cache}
    ports: ["8000:8000"]
    volumes: ["app-data:/data"]
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      API_URL: ${API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  app-data:
